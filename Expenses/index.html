<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Expenses</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--card:#2D2D2D;--s20:#E2E8F0;--s40:#94A3B8;--s60:#475569;--s80:#1E293B;--n10:#F5F5F5;--acc:#14B8A6;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;background:#000;color:#fff;font-family:Roboto,system-ui,-apple-system,sans-serif;overscroll-behavior:none;-webkit-user-select:none;user-select:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
#app{max-width:402px;height:100%;margin:0 auto;display:flex;flex-direction:column;position:relative;overflow:hidden}
header{display:flex;align-items:center;gap:4px;padding:8px 12px;height:48px;flex:none}
header h1{font-size:18px;margin:0;min-width:150px;text-align:center}
.arr{width:32px;height:32px;border-radius:16px;font-size:20px;color:var(--s40)}
#today{margin-left:auto;background:var(--acc);color:#04201d;font-size:13px;padding:6px 12px;border-radius:14px;transition:.25s}
#today.hide{opacity:0;pointer-events:none;transform:scale(.8)}
#view{flex:1;min-height:0;display:flex;flex-direction:column;touch-action:pan-y}
#content{flex:1;min-height:0;display:flex;flex-direction:column}
#content.inL{animation:inL .3s ease}
#content.inR{animation:inR .3s ease}
@keyframes inL{from{opacity:0;transform:translateX(60px)}}
@keyframes inR{from{opacity:0;transform:translateX(-60px)}}
#pie{position:relative;width:min(300px,72vw,34vh);aspect-ratio:1;margin:4px auto 10px;flex:none}
#pie svg{width:100%;height:100%;display:block}
#pie.pulse{animation:pulse .5s ease}
@keyframes pulse{40%{transform:scale(1.06)}}
#total{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:28px;text-shadow:0 1px 8px rgba(0,0,0,.7);pointer-events:none}
#legend{flex:1;min-height:0;overflow-y:auto;padding:0 12px 8px}
.row{display:flex;align-items:center;gap:12px;padding:6px 8px;min-height:32px;font-size:14px;line-height:20px;color:var(--s20)}
.row i{width:12px;height:12px;flex:none}
.row span{flex:1;font-weight:400;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row b{flex:1;text-align:right;font-weight:500;color:var(--n10)}
.row.h{color:var(--s40);border-bottom:1px solid var(--s60)}
.row.h *{color:var(--s40);font-weight:500}
.row.h i{opacity:0}
.row.new{animation:flash 1.2s ease}
@keyframes flash{0%,40%{background:rgba(20,184,166,.35)}}
.empty{text-align:center;color:var(--s40);font-weight:400;padding:20px}
#dock{flex:none;padding:0 11px 14px;touch-action:none;position:relative}
#hint{height:22px;text-align:center;font-size:13px;color:var(--s60);transition:.2s}
#hint.ready{color:var(--acc);animation:bob 1.2s infinite}
#hint.go{transform:scale(1.15)}
@keyframes bob{50%{transform:translateY(-4px)}}
#bar{display:flex;gap:10px;will-change:transform}
#bar.shake{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.pill{position:relative;height:44px;background:var(--card);border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:20px;border:2px solid transparent;transition:.2s;overflow:hidden;padding:0 6px}
#pl{flex:161}
#pv{flex:89}
#pd{flex:89;cursor:pointer}
.pill.on{border-color:var(--c,var(--acc));box-shadow:0 0 12px -2px var(--c,var(--acc));background:#1f2b2a}
.pill.miss{border-color:#EF4444}
.ph{color:var(--s60)}
#pl button{width:100%;height:100%;font-size:20px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#vi{width:100%;height:100%;background:none;border:0;outline:0;color:#fff;font:700 20px Roboto,sans-serif;text-align:center;-webkit-user-select:text;user-select:text}
#vi::placeholder{color:var(--s60)}
#dt{pointer-events:none;padding-right:13px}
#dateIcon{position:absolute;right:7px;top:50%;transform:translateY(-50%);font-size:13px;color:var(--s40);pointer-events:none}
#di{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer}
#sheet{position:absolute;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;opacity:0;pointer-events:none;transition:.25s;z-index:5}
#sheet.open{opacity:1;pointer-events:auto}
#sheet>div{width:100%;background:#161616;border-radius:16px 16px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));transform:translateY(100%);transition:.3s cubic-bezier(.2,.8,.2,1)}
#sheet.open>div{transform:none}
#sheet h2{margin:0 0 12px;font-size:15px;color:var(--s40)}
#chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px;max-height:30vh;overflow:auto}
.chip{display:flex;align-items:center;gap:8px;background:var(--card);padding:8px 12px;border-radius:16px;font-size:14px}
.chip i{width:10px;height:10px}
#nl{display:flex;gap:8px}
#nl input{flex:1;height:44px;background:var(--card);border:2px solid transparent;border-radius:5px;color:#fff;font:700 16px Roboto,sans-serif;padding:0 12px;outline:0;-webkit-user-select:text;user-select:text}
#nl input:focus{border-color:var(--acc)}
#nl button{background:var(--acc);color:#04201d;padding:0 16px;border-radius:5px}
</style>
</head>
<body>
<div id="app">
  <header>
    <button class="arr" id="pm" aria-label="Previous month">‹</button>
    <h1 id="mt"></h1>
    <button class="arr" id="nm" aria-label="Next month">›</button>
    <button id="today" class="hide">Today</button>
  </header>

  <div id="view">
    <div id="content">
      <div id="pie">
        <svg viewBox="0 0 100 100" id="svg"></svg>
        <div id="total"></div>
      </div>
      <div id="legend"></div>
    </div>
  </div>

  <div id="dock">
    <div id="hint"></div>
    <div id="bar">
      <div class="pill" id="pl">
        <button id="lb"><span class="ph">Label</span></button>
      </div>
      <div class="pill" id="pv">
        <input id="vi" inputmode="decimal" placeholder="Value" autocomplete="off">
      </div>
      <label class="pill" id="pd" title="Tap to change expense date">
        <span id="dt"></span>
        <span id="dateIcon" aria-hidden="true">▦</span>
        <input type="date" id="di" aria-label="Change expense date">
      </label>
    </div>
  </div>

  <div id="sheet">
    <div>
      <div id="chips"></div>
      <div id="nl">
        <input id="ni" placeholder="New label" maxlength="20">
        <button id="na">Add</button>
      </div>
    </div>
  </div>
</div>

<script>
const PAL=['#14B8A6','#3B82F6','#6366F1','#EC4899','#F59E0B','#FACC15'];
const $=id=>document.getElementById(id);
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const money=n=>'$'+n.toFixed(2);

let S={labels:{},exp:[]},db=null;

const idb=()=>new Promise((res,rej)=>{
  try{
    const r=indexedDB.open('expenses-app',1);
    r.onupgradeneeded=()=>r.result.createObjectStore('kv');
    r.onsuccess=()=>res(r.result);
    r.onerror=()=>rej(r.error);
  }catch(e){rej(e)}
});

function persist(){
  if(!db)return;
  try{
    db.transaction('kv','readwrite').objectStore('kv').put(JSON.parse(JSON.stringify(S)),'state');
  }catch(e){}
}

const now=new Date();
let view={y:now.getFullYear(),m:now.getMonth()};
let draft={label:'',amt:0,date:''};
let lastNew=null;

function render(dir){
  const key=view.y+'-'+pad(view.m+1);
  $('mt').textContent=new Date(view.y,view.m,1).toLocaleString('en-US',{month:'long',year:'numeric'});
  $('today').classList.toggle('hide',view.y===now.getFullYear()&&view.m===now.getMonth());

  const by={};
  S.exp.filter(e=>e.date.startsWith(key)).forEach(e=>by[e.label]=(by[e.label]||0)+e.amt);

  const rows=Object.entries(by).sort((a,b)=>b[1]-a[1]);
  const tot=rows.reduce((s,r)=>s+r[1],0);
  const ts=money(tot);

  $('total').textContent=ts;
  $('total').style.fontSize=(ts.length>9?22:ts.length>8?25:28)+'px';

  const R=39,C=2*Math.PI*R;
  let off=0,h='';

  if(!tot){
    h='<circle cx="50" cy="50" r="39" fill="none" stroke="#1E293B" stroke-width="22"/>';
  }

  rows.forEach(([l,v])=>{
    const len=v/tot*C;
    const g=rows.length>1?Math.min(1.2,len/2):0;
    h+=`<circle cx="50" cy="50" r="39" fill="none" stroke="${S.labels[l]}" stroke-width="22" stroke-dasharray="${len-g} ${C-len+g}" stroke-dashoffset="${-off}" transform="rotate(-90 50 50)"/>`;
    off+=len;
  });

  $('svg').innerHTML=h;

  let lg='';
  rows.forEach(([l,v])=>{
    lg+=`<div class="row${l===lastNew?' new':''}"><i style="background:${S.labels[l]}"></i><span></span><b>${money(v)}</b><b>${(v/tot*100).toFixed(1)}%</b></div>`;
  });

  if(!rows.length)lg+='<div class="empty">No expenses this month</div>';
  $('legend').innerHTML=lg;

  [...$('legend').querySelectorAll('.row:not(.h) span')].forEach((s,i)=>s.textContent=rows[i][0]);
  lastNew=null;

  if(dir){
    const c=$('content');
    c.classList.remove('inL','inR');
    void c.offsetWidth;
    c.classList.add(dir>0?'inL':'inR');
  }
}

function go(d){
  view.m+=d;
  if(view.m>11){view.m=0;view.y++}
  if(view.m<0){view.m=11;view.y--}
  render(d);
}

$('pm').onclick=()=>go(-1);
$('nm').onclick=()=>go(1);

$('today').onclick=()=>{
  const d=(now.getFullYear()*12+now.getMonth())-(view.y*12+view.m);
  view={y:now.getFullYear(),m:now.getMonth()};
  render(d>0?1:-1);
};

// Month swipe
let sx=0,sy=0,sid=null;
const vw=$('view');

vw.addEventListener('pointerdown',e=>{
  sx=e.clientX;
  sy=e.clientY;
  sid=e.pointerId;
});

vw.addEventListener('pointerup',e=>{
  if(sid!==e.pointerId)return;
  sid=null;
  const dx=e.clientX-sx,dy=e.clientY-sy;
  if(Math.abs(dx)>50&&Math.abs(dx)>Math.abs(dy)*1.5)go(dx<0?1:-1);
});

vw.addEventListener('pointercancel',()=>sid=null);

// Draft UI
const ready=()=>draft.label&&draft.amt>0;

function paintDraft(){
  const pl=$('pl');
  pl.classList.toggle('on',!!draft.label);
  pl.classList.remove('miss');
  pl.style.setProperty('--c',S.labels[draft.label]||'');

  $('lb').innerHTML=draft.label?'':'<span class="ph">Label</span>';
  if(draft.label)$('lb').textContent=draft.label;

  $('pv').classList.toggle('on',draft.amt>0);
  $('pv').classList.remove('miss');

  const dv=draft.date||ymd(new Date());
  const [y,m,d]=dv.split('-');
  $('dt').textContent=+m+'/'+ +d;
  $('di').value=draft.date;
  $('pd').classList.toggle('on',!!draft.date);
  $('dt').classList.toggle('ph',!draft.date);

  const r=ready(),hn=$('hint');
  hn.classList.toggle('ready',!!r);
  hn.textContent=r?'↑ Swipe up to save':'';
}

$('vi').addEventListener('input',e=>{
  let v=e.target.value.replace(/[^0-9.]/g,'');
  const p=v.split('.');
  if(p.length>2)v=p[0]+'.'+p.slice(1).join('');
  if(p[1]&&p[1].length>2)v=p[0]+'.'+p[1].slice(0,2);
  e.target.value=v;
  draft.amt=parseFloat(v)||0;
  paintDraft();
});

$('di').addEventListener('input',e=>{
  draft.date=e.target.value||'';
  paintDraft();
});

$('di').addEventListener('change',e=>{
  draft.date=e.target.value||'';
  paintDraft();
});

// Label sheet
function chips(){
  $('chips').innerHTML='';
  Object.keys(S.labels).forEach(l=>{
    const b=document.createElement('button');
    b.className='chip';
    b.innerHTML='<i style="background:'+S.labels[l]+'"></i><span></span>';
    b.lastChild.textContent=l;
    b.onclick=()=>pick(l);
    $('chips').appendChild(b);
  });
}

function pick(l){
  draft.label=l;
  $('sheet').classList.remove('open');
  paintDraft();
}

$('lb').onclick=()=>{
  chips();
  $('sheet').classList.add('open');
};

$('sheet').addEventListener('click',e=>{
  if(e.target.id==='sheet')$('sheet').classList.remove('open');
});

function addLabel(){
  const n=$('ni').value.trim();
  if(!n)return;
  if(!S.labels[n]){
    S.labels[n]=PAL[Object.keys(S.labels).length%6];
    persist();
  }
  $('ni').value='';
  pick(n);
}

$('na').onclick=addLabel;
$('ni').addEventListener('keydown',e=>{
  if(e.key==='Enter')addLabel();
});

// Swipe up to save
const bar=$('bar'),dock=$('dock');
let by0=0,bx0=0,bid=null,drag=false,ld=0;

dock.addEventListener('pointerdown',e=>{
  by0=e.clientY;
  bx0=e.clientX;
  bid=e.pointerId;
  drag=false;
  ld=0;
});

dock.addEventListener('pointermove',e=>{
  if(bid!==e.pointerId)return;
  const dy=e.clientY-by0;

  if(!drag&&dy<-10&&Math.abs(dy)>Math.abs(e.clientX-bx0)){
    drag=true;
    dock.setPointerCapture(bid);
    bar.style.transition='none';
    document.activeElement&&document.activeElement.blur();
  }

  if(drag){
    ld=Math.min(0,dy);
    bar.style.transform=`translateY(${ld}px) scale(${1+ld/1500})`;
    $('hint').classList.toggle('go',ld<-70);
  }
});

function end(e){
  if(bid!==e.pointerId)return;
  bid=null;
  if(!drag)return;

  drag=false;
  $('hint').classList.remove('go');

  if(ld<-70&&ready())return save();

  bar.style.transition='transform .3s cubic-bezier(.2,.8,.2,1)';
  bar.style.transform='';

  if(ld<-70){
    if(!draft.label)$('pl').classList.add('miss');
    if(!(draft.amt>0))$('pv').classList.add('miss');
    bar.classList.remove('shake');
    void bar.offsetWidth;
    bar.classList.add('shake');
  }
}

dock.addEventListener('pointerup',end);
dock.addEventListener('pointercancel',end);

function save(){
  bar.style.transition='transform .35s cubic-bezier(.5,0,.8,.4),opacity .35s';
  bar.style.transform='translateY(-55vh) scale(.7)';
  bar.style.opacity='0';

  setTimeout(()=>{
    const dd=draft.date||ymd(new Date());
    const d=dd.split('-');

    S.exp.push({id:Date.now(),label:draft.label,amt:draft.amt,date:dd});
    persist();

    lastNew=draft.label;
    view={y:+d[0],m:+d[1]-1};
    draft={label:'',amt:0,date:''};
    $('vi').value='';

    render();
    paintDraft();

    const p=$('pie');
    p.classList.remove('pulse');
    void p.offsetWidth;
    p.classList.add('pulse');

    bar.style.transition='none';
    bar.style.transform='translateY(50px)';
    void bar.offsetWidth;
    bar.style.transition='transform .4s cubic-bezier(.2,.8,.2,1),opacity .4s';
    bar.style.transform='';
    bar.style.opacity='1';
  },360);
}

idb().then(d=>{
  db=d;
  return new Promise(r=>{
    const q=d.transaction('kv').objectStore('kv').get('state');
    q.onsuccess=()=>{
      if(q.result&&q.result.exp)S=q.result;
      r();
    };
    q.onerror=()=>r();
  });
}).catch(()=>{}).then(()=>{
  render();
  paintDraft();
});
</script>
</body>
</html>
