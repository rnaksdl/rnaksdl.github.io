<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Who is He</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
  :root{
    --bg:#000000; --panel:#262626; --panel2:#515151; --text:#FFFFFF;
    --muted:rgba(255,255,255,.5); --accent:#C9E9FF;
    --red:#FF383C; --yellow:#FFCC00; --green:#34C759; --blue:#0088FF;
    --danger: var(--red);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%; min-height:100dvh; margin:0; background:#000; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;}
  #phone{
    max-width:430px; width:100%; margin:0 auto; background:var(--bg); color:var(--text);
    position:relative; overflow:hidden; display:flex; flex-direction:column;
    border-left:1px solid #111; border-right:1px solid #111;
    height:100vh; height:100dvh; min-height:100vh; min-height:100dvh;
  }
  @media (min-width:700px){ #phone{ max-width:480px; } }
  .screen{position:absolute; inset:0; display:none; flex-direction:column; background:var(--bg);}
  .screen.active{display:flex;}
  /* ---------- Splash ---------- */
  #splash{align-items:center; justify-content:center; gap:10px;}
  #splashLogo{width:120px; height:120px; fill:#fff; animation:logoPulse 1.4s ease-in-out infinite;}
  @keyframes logoPulse{0%,100%{opacity:.4; transform:scale(.92);} 50%{opacity:1; transform:scale(1);}}

/* ---------- Main reading screen ---------- */
  #main{min-height:0;}
  #mainScroll{flex:1 1 auto; min-height:0; overflow-y:auto; -webkit-overflow-scrolling:touch;
    padding:16px clamp(14px,4vw,18px) 14px;}
  #topSentinel, #bottomSentinel{height:1px; width:100%;}
  #verseContent{font-size:18px; line-height:1.6;}
  .book-title{font-weight:800; font-size:24px; margin:26px 0 2px;}
  .chapter-block:first-child .book-title{margin-top:4px;}
  .chapter-heading{font-weight:700; font-size:13px; color:var(--muted); text-transform:uppercase;
    letter-spacing:.05em; margin:0 0 14px;}
  .verse{
    display:block; position:relative; cursor:pointer;
    padding:2px 4px; margin:0 -4px 0.9em -4px; border-radius:6px;
    transition:background-color .15s ease;
  }
  .verse sup{color:var(--muted); font-size:11px; font-weight:600; margin-right:3px;}
  .verse.selected{text-decoration:underline dotted; text-underline-offset:4px;}
  .verse.has-note{text-decoration:underline solid var(--text); text-underline-offset:3px;}  .verse.hl-red{background:rgba(255,56,60,.28);}
  .verse.hl-yellow{background:rgba(255,204,0,.28);}
  .verse.hl-green{background:rgba(52,199,89,.28);}
  .verse.hl-blue{background:rgba(0,136,255,.28);}
  .verse.placeholder{color:var(--muted); font-style:italic; cursor:default;}

  /* ---------- Backdrop for floating panels ---------- */
  #sheetBackdrop{position:absolute; inset:0; background:rgba(0,0,0,.55); z-index:15;
    opacity:0; pointer-events:none; transition:opacity .2s ease;}
  #sheetBackdrop.show{opacity:1; pointer-events:auto;}

  /* Bottom nav — always docked at bottom of screen, outside the scroll area */
  #bottomNav{
    flex-shrink:0; display:flex; align-items:center; gap:12px; z-index:10;
    padding: clamp(10px,3vw,14px) clamp(12px,4vw,20px) calc(clamp(10px,3vw,14px) + env(safe-area-inset-bottom,0px));
    background:linear-gradient(to bottom, rgba(0,0,0,0), rgba(0,0,0,.85) 45%, #000 100%);
  }
  .nav-btn{width:clamp(44px,12vw,50px); height:clamp(44px,12vw,50px); border-radius:50%; background:var(--panel);
    box-shadow:0 8px 24px rgba(0,0,0,.55); display:flex; align-items:center; justify-content:center;
    border:none; color:#fff; font-size:18px; cursor:pointer; flex-shrink:0;}
  #tabPillWrap{flex:1; min-width:0;}
  #tabPill{background:var(--panel); box-shadow:0 8px 24px rgba(0,0,0,.55); border-radius:26px;
    padding:11px 16px; text-align:center; font-size:14px; color:#fff; cursor:pointer; user-select:none;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  #tabDots{display:flex; gap:4px; justify-content:center; margin-top:6px;}
  .tab-dot{width:5px; height:5px; border-radius:50%; background:var(--muted);}
  .tab-dot.active{background:var(--accent);}

  /* ---------- Floating Sheets (Settings / Search / Notes) ---------- */
  .sheet{position:absolute; left:14px; right:14px; bottom:100px; max-height:70vh; max-height:70dvh; background:var(--panel);
    border-radius:22px; box-shadow:0 12px 40px rgba(0,0,0,.6); z-index:20; display:none; flex-direction:column;
    padding:18px; overflow-y:auto;}
  .sheet.open{display:flex;}
  .sheet-top{display:flex; align-items:center; gap:10px; margin-bottom:16px;}
  .icon-btn{background:none; border:none; color:#fff; font-size:20px; cursor:pointer; border-radius:50%;}
  .icon-btn.small{font-size:16px; width:32px; height:32px; border-radius:50%; background:var(--panel2);
    display:flex; align-items:center; justify-content:center; flex-shrink:0;}
  .search-input, .text-input{flex:1; background:var(--panel2); border:none; border-radius:20px; padding:12px 16px;
    color:#fff; font-size:15px; outline:none; min-width:0;}
  .close-x{background:var(--panel2); border:none; color:#fff; width:36px; height:36px; border-radius:50%; cursor:pointer; flex-shrink:0;}

  /* Settings */
  .settings-row{display:flex; align-items:center; justify-content:space-between; padding:14px 4px; border-bottom:1px solid rgba(255,255,255,.08); gap:10px;}
  .settings-row label{font-size:15px;}
  select, .btn{background:var(--panel2); color:#fff; border:none; border-radius:14px; padding:8px 14px; font-size:14px; cursor:pointer;}
  .btn.full{width:100%; padding:12px 0; font-size:14px;}
  .fontsize-toggle button{background:var(--panel2); border:none; color:#fff; border-radius:12px; padding:6px 12px; margin-left:6px; cursor:pointer;}
  #signInBtn{background:#fff; color:#000; font-weight:600;}
  input[type=range]{width:120px;}
  #apiKeyInput{width:100%; margin-top:6px; background:var(--panel2); border:none; border-radius:10px; padding:8px 10px; color:#fff;}

  /* Search suggestions */
  #suggestions{margin-top:12px; display:flex; flex-direction:column; gap:8px;}
  .sugg-item{background:var(--panel2); padding:12px 14px; border-radius:12px; cursor:pointer;}
  #quickTabs{display:flex; gap:8px; margin-top:16px;}
  .quick-chip{flex:1; text-align:center; background:var(--panel2); padding:10px; border-radius:14px; font-size:13px; cursor:pointer;}
  .quick-chip.active{outline:2px solid var(--accent);}

  /* Notes list */
  .note-row{display:flex; justify-content:space-between; align-items:center; padding:14px 6px; border-bottom:1px solid rgba(255,255,255,.08); cursor:pointer; gap:10px;}
  .note-row-main{display:flex; align-items:center; gap:8px; flex:1; min-width:0;}
  .note-row-title{overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .note-row .dot{width:8px; height:8px; border-radius:50%; flex-shrink:0; display:inline-block;}
  .note-date{color:var(--muted); font-size:12px; flex-shrink:0;}
  .note-delete-btn{background:none; border:none; color:var(--red); font-size:16px; cursor:pointer; padding:4px; flex-shrink:0;}
  #graphBtn{margin-left:auto;}

  /* Verse popup — floating, direct-highlight */
  #versePopup{position:absolute; left:14px; right:14px; bottom:100px; background:var(--panel); border-radius:20px;
    padding:14px; z-index:20; display:none; flex-direction:column; gap:10px; box-shadow:0 12px 40px rgba(0,0,0,.6);}
  #versePopup.open{display:flex;}
  .popup-header{display:flex; align-items:center; justify-content:space-between; gap:10px;}
  #popupRef{font-size:14px; font-weight:600; color:var(--text); flex:1; min-width:0;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .popup-note-preview{background:var(--panel2); padding:8px 10px; border-radius:10px; font-size:13px; cursor:pointer;}
  #highlightRow{display:flex; gap:12px; justify-content:center; padding:4px 0;}
  .hl-swatch{width:34px; height:34px; border-radius:50%; cursor:pointer; border:2px solid transparent; flex-shrink:0;}
  #blbLinkPopup{color:var(--accent); font-size:13px; text-decoration:underline; text-align:center; cursor:pointer;}

  /* Note editor */
  #noteEditor .sheet-top{align-items:center; flex-wrap:wrap;}
  #noteTitle{font-size:16px; font-weight:600; background:var(--panel2); border:none; border-radius:12px; padding:10px 14px; color:#fff; width:100%;}
  #refChip{background:var(--panel2); border-radius:14px; padding:6px 12px; font-size:12px; color:var(--muted);
    white-space:nowrap; cursor:pointer; max-width:55%; overflow:hidden; text-overflow:ellipsis;}
  #modeBadge{font-size:12px; color:var(--muted); white-space:nowrap;}
  #modeBadge.active{color:var(--accent); font-weight:700;}
  #noteContentWrap{position:relative; flex:1; margin-top:12px; border-radius:14px; transition:outline-color .15s ease;
    outline:2px solid transparent;}
  #noteContentWrap.drawing{outline-color:var(--accent);}
  #noteContent{width:100%; height:100%; background:transparent; border:none; color:#fff; font-size:15px; resize:none; outline:none; padding:2px;}
  #drawCanvas{position:absolute; inset:0; touch-action:none; border-radius:14px;}
  #drawCanvas.active{pointer-events:auto;}
  #drawCanvas:not(.active){pointer-events:none;}
  #drawToolbar{display:flex; align-items:center; gap:14px; padding-top:10px; border-top:1px solid rgba(255,255,255,.08);
    flex-wrap:wrap; transition:opacity .15s ease;}
  #drawToolbar .tool{background:none; border:none; color:#fff; font-size:20px; cursor:pointer; opacity:1; border-radius:8px; padding:4px;}
  #drawToolbar .tool.dim{opacity:.2; pointer-events:none;}       /* disabled state — undo/redo only */
  #drawToolbar .tool.inactive{opacity:.4;}                        /* unselected but still clickable — pen/eraser */
  #drawToolbar .tool.sel{outline:1px solid #fff;}
  #colorSwatch{width:22px; height:22px; border-radius:50%; border:1px solid #666; cursor:pointer; flex-shrink:0;}
  #drawToggleBtn{width:36px; height:36px; display:flex; align-items:center; justify-content:center; background:var(--panel2);}
  #drawToggleBtn.draw-active{background:var(--accent); color:#000;}

  /* Graph */
  #graphCanvas{flex:1; touch-action:none;}

  @media (max-width:360px){
    .nav-btn{font-size:16px;}
    #tabPill{padding:9px 12px; font-size:13px;}
  }
</style>
</head>
<body>
<div id="phone">

  <!-- SPLASH -->
  <div id="splash" class="screen active">
    <svg id="splashLogo" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
      <rect x="29" y="20" width="16" height="14"/>
      <rect x="55" y="20" width="16" height="14"/>
      <rect x="29" y="44" width="16" height="36"/>
      <rect x="55" y="44" width="16" height="36"/>
    </svg>
  </div>


  <!-- MAIN -->
  <div id="main" class="screen">
    <div id="mainScroll">
      <div id="topSentinel"></div>
      <div id="verseContent">Loading passage…</div>
      <div id="bottomSentinel"></div>
    </div>
    <div id="bottomNav">
      <button class="nav-btn" onclick="openSheet('settingsSheet')">⚙️</button>
      <div id="tabPillWrap">
        <div id="tabPill" onclick="openSheet('searchSheet')">Eph 5</div>
        <div id="tabDots"></div>
      </div>
      <button class="nav-btn" onclick="openNotesList()">🗒️</button>
    </div>
  </div>

  <!-- BACKDROP for floating panels -->
  <div id="sheetBackdrop"></div>

  <!-- VERSE POPUP -->
  <div id="versePopup">
    <div class="popup-header">
      <span id="popupRef"></span>
      <button class="icon-btn small" onclick="popupAction('copy')" title="Copy">⧉</button>
    </div>
    <div id="popupNotes"></div>
    <button class="btn full" onclick="popupAction('note')">＋ Leave a new note</button>
    <div id="highlightRow">
      <div class="hl-swatch" style="background:var(--red)" onclick="applyHighlight('red')"></div>
      <div class="hl-swatch" style="background:var(--yellow)" onclick="applyHighlight('yellow')"></div>
      <div class="hl-swatch" style="background:var(--green)" onclick="applyHighlight('green')"></div>
      <div class="hl-swatch" style="background:var(--blue)" onclick="applyHighlight('blue')"></div>
    </div>
    <span id="blbLinkPopup" onclick="popupAction('blb')">Look up Blue Letter Bible</span>
  </div>

  <!-- SETTINGS SHEET -->
  <div id="settingsSheet" class="sheet">
    <div class="sheet-top">
      <div style="flex:1; font-size:18px; font-weight:600;">Settings</div>
      <button class="close-x" onclick="closeSheet('settingsSheet')">✕</button>
    </div>

    <div class="settings-row">
      <label>Account</label>
      <button id="signInBtn" class="btn" onclick="handleGoogleAuthClick()">Sign in</button>
    </div>

    <div class="settings-row">
      <label>Bible letter size</label>
      <div class="fontsize-toggle">
        <button onclick="changeFontSize(-2)">A</button>
        <button onclick="changeFontSize(2)" style="font-size:18px;">A</button>
      </div>
    </div>

    <div class="settings-row">
      <label>Translation</label>
      <select id="translationSelect" onchange="onTranslationChange(this.value)">
        <option value="">Load with API key ↓</option>
      </select>
    </div>

    <div class="settings-row" style="flex-direction:column; align-items:flex-start;">
      <label>api.bible API key</label>
      <input id="apiKeyInput" placeholder="Paste your api.bible key…" />
      <button class="btn" style="margin-top:8px;" onclick="loadBibleList()">Fetch my translations</button>
    </div>

    <div class="settings-row">
      <label>Sync status</label>
      <div id="syncStatus" style="font-size:12px; color:var(--muted);">Not signed in</div>
    </div>

    <div class="settings-row">
      <label>Backup</label>
      <button class="btn" onclick="exportBackup()">Export JSON</button>
    </div>

    <div class="settings-row">
      <label>Reset local data</label>
      <button class="btn" style="background:var(--danger);" onclick="resetAll()">Clear</button>
    </div>
  </div>

  <!-- SEARCH SHEET -->
  <div id="searchSheet" class="sheet">
    <div class="sheet-top">
      <button class="icon-btn" onclick="openGraph()">✳️</button>
      <input class="search-input" id="searchInput" placeholder="Search book, chapter, verse…" oninput="onSearchInput()" />
      <button class="close-x" onclick="closeSheet('searchSheet')">✕</button>
    </div>
    <div id="quickTabs"></div>
    <div id="suggestions"></div>
  </div>

  <!-- NOTES LIST SHEET -->
  <div id="notesSheet" class="sheet">
    <div class="sheet-top">
      <button class="icon-btn" onclick="openGraph()">✳️</button>
      <input class="search-input" id="notesSearch" placeholder="Search notes…" oninput="renderNotesList()" />
      <button class="close-x" onclick="closeSheet('notesSheet')">✕</button>
    </div>
    <div id="notesListWrap" style="overflow-y:auto; flex:1;"></div>
    <button class="btn" style="margin-top:10px;" onclick="createNote()">Leave a new note</button>
  </div>

  <!-- NOTE EDITOR -->
  <div id="noteEditor" class="screen">
    <div class="sheet-top" style="padding:16px 16px 0;">
      <button class="icon-btn" id="drawToggleBtn" onclick="toggleDrawMode()">✏️</button>
      <span id="refChip" onclick="openVersePicker()"></span>
      <span id="modeBadge">Typing</span>
      <div style="flex:1;"></div>
      <button class="close-x" onclick="closeNoteEditor()">✕</button>
    </div>
    <div style="padding:0 16px;">
      <input id="noteTitle" placeholder="Title" oninput="saveCurrentNote()" />
    </div>
    <div id="noteContentWrap" style="margin:0 16px;">
      <textarea id="noteContent" oninput="saveCurrentNote()"></textarea>
      <canvas id="drawCanvas"></canvas>
    </div>
    <div style="padding:0 16px 16px;">
      <div id="drawToolbar">
        <div id="colorSwatch" style="background:#fff;" onclick="pickColor()"></div>
        <input type="color" id="colorPicker" style="display:none;" onchange="setDrawColor(this.value)">
        <button class="tool sel" id="penTool" onclick="selectTool('pen')">✒️</button>
        <button class="tool inactive" id="eraserTool" onclick="selectTool('eraser')">🧽</button>
        <button class="tool dim" id="undoBtn" onclick="undoStroke()">↶</button>
        <button class="tool dim" id="redoBtn" onclick="redoStroke()">↷</button>
      </div>
    </div>
  </div>

  <!-- GRAPH VIEW -->
  <div id="graphScreen" class="screen">
    <div class="sheet-top" style="padding:16px;">
      <div style="flex:1; font-size:18px; font-weight:600;">Knowledge Graph</div>
      <button class="close-x" onclick="closeGraph()">✕</button>
    </div>
    <canvas id="graphCanvas"></canvas>
  </div>

</div>

<script>
/* =========================================================
   CONFIG — fill these in for your own deployment
========================================================= */
const GOOGLE_CLIENT_ID = "198827651836-8ml3cr2uonbvprflnim9reqe2ovo8865.apps.googleusercontent.com";
const DRIVE_SCOPE = "https://www.googleapis.com/auth/drive.appdata";

/* =========================================================
   BOOK DATA (standard USFM-style ids + chapter counts)
========================================================= */
const BOOKS = [

// Blue Letter Bible slug exceptions (BLB uses slightly different abbrevs for a few books)
const BLB_SLUG_OVERRIDES = {SNG:"sos", EZK:"eze", JOL:"joe", NAM:"nah", "1SA":"1sa","2SA":"2sa"};

/* Fallback offline sample (World English Bible — public domain) — only Eph 5 has real text */
const FALLBACK_PASSAGE = {
  ref:"EPH.5",
  verses:{
    14:"for the light makes everything visible. This is why it is said, “Awake, O sleeper, rise up from the dead, and Christ will give you light.”",
    15:"So be careful how you live. Don't live like fools, but like those who are wise.",
    16:"Make the most of every opportunity in these evil days.",
    17:"Don't act thoughtlessly, but understand what the Lord wants you to do.",
    18:"Don't be drunk with wine, because that will ruin your life. Instead, be filled with the Holy Spirit,",
    19:"singing psalms and hymns and spiritual songs among yourselves, and making music to the Lord in your heart,",
    20:"giving thanks always for all things in the name of our Lord Jesus Christ, to God the Father."
  }
};

/* =========================================================
   STATE + PERSISTENCE
========================================================= */
let state = loadState();
function defaultState(){
  return {
    settings:{fontSize:18, bibleId:"", apiKey:"", signedIn:false},
    tabs:[
      {ref:"EPH.5", label:"Eph 5", verseFocus:15},
      {ref:"JHN.3", label:"Jn 3", verseFocus:16},
      {ref:"PSA.119", label:"Psa 119", verseFocus:176}
    ],
    activeTab:0,
    notes:[],       // {id,title,verseRefs[],content,color,strokes[],createdAt,updatedAt}
    highlights:{}   // verseKey -> "red"|"yellow"|"green"|"blue"
  };
}
function loadState(){
  try{ const raw = localStorage.getItem("whoishe_state"); return raw?JSON.parse(raw):defaultState(); }
  catch(e){ return defaultState(); }
}
function saveState(){
  localStorage.setItem("whoishe_state", JSON.stringify(state));
  if(state.settings.signedIn) debounceDriveSave();
}
let driveSaveTimer=null;
function debounceDriveSave(){ clearTimeout(driveSaveTimer); driveSaveTimer=setTimeout(driveSave, 1500); }

/* =========================================================
   NAV HELPERS
========================================================= */
function showScreen(id){
  document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));
  document.getElementById(id).classList.add("active");
}
function showBackdrop(onClickClose){
  const bd = document.getElementById("sheetBackdrop");
  bd.classList.add("show");
  bd.onclick = onClickClose;
}
function hideBackdrop(){
  const bd = document.getElementById("sheetBackdrop");
  bd.classList.remove("show");
  bd.onclick = null;
}
function openSheet(id){
  document.getElementById(id).classList.add("open");
  showBackdrop(()=>closeSheet(id));
  if(id==="searchSheet") renderQuickTabs();
}

  document.getElementById(id).classList.remove("open");
  hideBackdrop();
  if(id==="searchSheet"){
    searchPickTarget = null;
    const input = document.getElementById("searchInput");
    if(input) input.placeholder = "Search book, chapter, verse…";

}
function closeAllSheets(){
  ["settingsSheet","searchSheet","notesSheet"].forEach(id=>{
    document.getElementById(id).classList.remove("open");
  });
  hideBackdrop();
  searchPickTarget = null;
}

/* =========================================================
   BIBLE TEXT — api.bible integration
========================================================= */
const WANTED_TRANSLATIONS = [
  {
    // Matches id "a761ca71e0b3ddcf-01", name "New American Standard Bible 2020", abbreviation "NASB"
    match: ["nasb"],
    label: "NASB 2020"
  },
  {
    // Matches name "New International Version 2011", abbreviation "NIV11"
    match: ["niv11"],
    label: "NIV"
  },
  {
    // Matches abbreviation "engKJV" or "KJV"
    match: ["kjv"],
    label: "KJV"
  },
  {
    match: ["nlt"],
    label: "NLT"
  }
];

async function loadBibleList(silent){
  const key = (silent && state.settings.apiKey) ? state.settings.apiKey : document.getElementById("apiKeyInput").value.trim();
  if(!key){ if(!silent) alert("Paste your api.bible API key first."); return; }
  state.settings.apiKey = key; saveState();
  try{
    const res = await fetch(`${API_BIBLE_BASE}/bibles`, {headers:{"api-key":key}});
    const json = await res.json();
    const all = json.data || [];

    // Filter down to only your 5 requested translations, matching on abbreviation/name text
    const filtered = [];
    WANTED_TRANSLATIONS.forEach(w=>{
      const found = all.find(b=>{
        const hay = `${b.abbreviation||""} ${b.name||""} ${b.abbreviationLocal||""}`.toLowerCase();
        return w.match.some(m => hay.includes(m));
      });
      if(found) filtered.push({...found, _label:w.label});
    });

    const sel = document.getElementById("translationSelect");
    sel.innerHTML = "";
    if(filtered.length === 0){
      const opt = document.createElement("option");
      opt.value = ""; opt.textContent = "None of your 5 translations available on this key";
      sel.appendChild(opt);
    } else {
      filtered.forEach(b=>{
        const opt = document.createElement("option");
        opt.value = b.id; opt.textContent = b._label;
        sel.appendChild(opt);
      });
    }

    if(state.settings.bibleId && filtered.some(b=>b.id===state.settings.bibleId)){
      sel.value = state.settings.bibleId;
    } else if(filtered.length){
      state.settings.bibleId = filtered[0].id; saveState();
    }
    loadActiveTab();
  }catch(e){
    if(!silent) alert("Couldn't reach api.bible. Check your key/network.");
  }
}

function onTranslationChange(bibleId){ state.settings.bibleId = bibleId; saveState(); loadActiveTab(); }

async function fetchChapterVerses(bookId, chapter){
  const {apiKey, bibleId} = state.settings;
  if(!apiKey || !bibleId) return null; // no key set -> caller falls back / shows placeholder
  try{
    const res = await fetch(`${API_BIBLE_BASE}/bibles/${bibleId}/chapters/${bookId}.${chapter}?content-type=html&include-verse-numbers=true`, {headers:{"api-key":apiKey}});
    const json = await res.json();
    return parseVersesFromHTML(json.data.content);
  }catch(e){ console.warn("Chapter fetch failed", e); return null; }
}
// api.bible wraps verse numbers in elements with class "v" — we skip text INSIDE that
// element (the number label itself) so we don't double-print it alongside our own <sup>.
function parseVersesFromHTML(html){
  const div = document.createElement("div");
  div.innerHTML = html;
  const walker = document.createTreeWalker(div, NodeFilter.SHOW_ALL);
  let verses={}, current=null, buffer="";
  function flush(){ if(current!=null){ verses[current]=(verses[current]||"")+buffer; } buffer=""; }
  let node;
  while(node = walker.nextNode()){
    if(node.nodeType===1 && node.classList && node.classList.contains("v")){
      flush(); current = node.getAttribute("data-number")||node.textContent.trim(); buffer="";
    } else if(node.nodeType===3){
      // skip the verse-number label text that lives inside the .v span itself
      if(node.parentElement && node.parentElement.closest(".v")) continue;
      buffer += node.textContent;
    }
  }
  flush();
  Object.keys(verses).forEach(k=> verses[k]=verses[k].replace(/\s+/g," ").trim());
  return verses;
}
async function getVersesFor(bookId, chapter){
  let verses = await fetchChapterVerses(bookId, chapter);
  if(!verses && bookId==="EPH" && chapter===5){ verses = FALLBACK_PASSAGE.verses; }
  return verses; // null means "no key / fetch failed" -> caller renders a placeholder line
}

/* =========================================================
   CONTINUOUS WHOLE-BIBLE SCROLL ENGINE
========================================================= */
const MAX_LOADED_CHAPTERS = 12;
let loadedChapters = [];      // ordered front-to-back list of {bookId, chapter} currently in DOM
let isBusy = false;           // guards concurrent loads / prevents races during reset
let currentDisplayRef = null; // {bookId, chapter} currently at top of viewport, drives sticky tab label

function bookArrIndex(bookId){ return BOOKS.findIndex(b=>b.id===bookId); }
function nextChapterRef(bookId, chapter){
  const idx = bookArrIndex(bookId); const book = BOOKS[idx];
  if(chapter < book.chapters) return {bookId, chapter: chapter+1};
  if(idx < BOOKS.length-1) return {bookId: BOOKS[idx+1].id, chapter: 1};
  return null; // end of Revelation — end of Bible
}
function prevChapterRef(bookId, chapter){
  if(chapter > 1) return {bookId, chapter: chapter-1};
  const idx = bookArrIndex(bookId);
  if(idx > 0){ const p = BOOKS[idx-1]; return {bookId:p.id, chapter:p.chapters}; }
  return null; // before Genesis 1 — start of Bible
}
function globalChapterIndex(bookId, chapter){
  let idx=0;
  for(const b of BOOKS){ if(b.id===bookId) return idx+chapter; idx += b.chapters; }
  return idx;
}
function chapterKeyEq(a,b){ return a.bookId===b.bookId && a.chapter===b.chapter; }

function buildChapterDOM(bookId, chapter, verses){
  const book = BOOKS.find(b=>b.id===bookId);
  const container = document.createElement("div");
  container.className = "chapter-block";
  container.dataset.book = bookId;
  container.dataset.chapter = chapter;

  if(chapter === 1){
    const title = document.createElement("div");
    title.className = "book-title";
    title.textContent = book ? book.name : bookId;
    container.appendChild(title);
  }
  const heading = document.createElement("div");
  heading.className = "chapter-heading";
  heading.textContent = "Chapter " + chapter;
  container.appendChild(heading);

  if(verses){
    Object.keys(verses).sort((a,b)=>+a-+b).forEach(num=>{
      const span = document.createElement("span");
      span.className = "verse";
      const key = `${bookId}.${chapter}.${num}`;
      span.dataset.ref = key;
      applyVerseClasses(span, key);
      const sup = document.createElement("sup");
      sup.textContent = num;             // verse number — small superscript, single source
      span.appendChild(sup);
      span.appendChild(document.createTextNode(verses[num]));
      span.onclick = ()=> toggleVerseSelect(span, key);
      container.appendChild(span);
    });
  } else {
    const msg = document.createElement("div");
    msg.className = "verse placeholder";
    msg.textContent = "Add an api.bible API key in Settings to load this chapter.";
    container.appendChild(msg);
  }
  return container;
}

async function appendChapterBlock(bookId, chapter){
  const ref = {bookId, chapter};
  if(loadedChapters.some(c=>chapterKeyEq(c,ref))) return;
  const verses = await getVersesFor(bookId, chapter);
  const el = buildChapterDOM(bookId, chapter, verses);
  document.getElementById("verseContent").appendChild(el);
  loadedChapters.push(ref);
  trimChapters();
}
async function prependChapterBlock(bookId, chapter){
  const ref = {bookId, chapter};
  if(loadedChapters.some(c=>chapterKeyEq(c,ref))) return;
  const verses = await getVersesFor(bookId, chapter);
  const el = buildChapterDOM(bookId, chapter, verses);
  const wrap = document.getElementById("verseContent");
  const scroller = document.getElementById("mainScroll");
  const prevHeight = scroller.scrollHeight;
  wrap.insertBefore(el, wrap.firstChild);
  loadedChapters.unshift(ref);
  requestAnimationFrame(()=>{ scroller.scrollTop += (scroller.scrollHeight - prevHeight); });
  trimChapters();
}
function trimChapters(){
  const wrap = document.getElementById("verseContent");
  const scroller = document.getElementById("mainScroll");
  while(loadedChapters.length > MAX_LOADED_CHAPTERS && currentDisplayRef){
    const first = loadedChapters[0], last = loadedChapters[loadedChapters.length-1];
    const distFirst = Math.abs(globalChapterIndex(first.bookId,first.chapter) - globalChapterIndex(currentDisplayRef.bookId,currentDisplayRef.chapter));
    const distLast  = Math.abs(globalChapterIndex(last.bookId,last.chapter) - globalChapterIndex(currentDisplayRef.bookId,currentDisplayRef.chapter));
    if(distFirst >= distLast){
      const block = wrap.querySelector(`.chapter-block[data-book="${first.bookId}"][data-chapter="${first.chapter}"]`);
      if(block){ const h = block.offsetHeight; block.remove(); scroller.scrollTop -= h; }
      loadedChapters.shift();
    } else {
      const block = wrap.querySelector(`.chapter-block[data-book="${last.bookId}"][data-chapter="${last.chapter}"]`);
      if(block) block.remove();
      loadedChapters.pop();
    }
  }
}

function setupInfiniteScroll(){
  const scroller = document.getElementById("mainScroll");
  const topSentinel = document.getElementById("topSentinel");
  const bottomSentinel = document.getElementById("bottomSentinel");
  const opts = {root:scroller, rootMargin:"600px 0px 600px 0px", threshold:0};

  new IntersectionObserver(async entries=>{
    if(entries[0].isIntersecting && !isBusy && loadedChapters.length){
      const first = loadedChapters[0];
      const prev = prevChapterRef(first.bookId, first.chapter);
      if(prev){ isBusy=true; await prependChapterBlock(prev.bookId, prev.chapter); isBusy=false; }
    }
  }, opts).observe(topSentinel);

  new IntersectionObserver(async entries=>{
    if(entries[0].isIntersecting && !isBusy && loadedChapters.length){
      const last = loadedChapters[loadedChapters.length-1];
      const next = nextChapterRef(last.bookId, last.chapter);
      if(next){ isBusy=true; await appendChapterBlock(next.bookId, next.chapter); isBusy=false; }
    }
  }, opts).observe(bottomSentinel);
}

/* Sticky tab-pill label tracks whichever chapter block currently sits at the top of the viewport */
let headerRAFPending=false;
function setupHeaderScrollTracking(){
  document.getElementById("mainScroll").addEventListener("scroll", ()=>{
    if(headerRAFPending) return;
    headerRAFPending = true;
    requestAnimationFrame(()=>{ updateHeaderFromScroll(); headerRAFPending=false; });
  });
}
function updateHeaderFromScroll(){
  const scroller = document.getElementById("mainScroll");
  const scrollerTop = scroller.getBoundingClientRect().top;
  let current = null;
  document.querySelectorAll(".chapter-block").forEach(b=>{
    if(b.getBoundingClientRect().top - scrollerTop <= 40) current = b;
  });
  if(current){
    const bookId = current.dataset.book, chapter = +current.dataset.chapter;
    if(!currentDisplayRef || currentDisplayRef.bookId!==bookId || currentDisplayRef.chapter!==chapter){
      currentDisplayRef = {bookId, chapter};
      updateTabLabel(bookId, chapter);
    }
  }
}
function updateTabLabel(bookId, chapter){
  const book = BOOKS.find(b=>b.id===bookId);
  document.getElementById("tabPill").textContent = (book?book.name:bookId) + " " + chapter;
}

/* Entry point — called on boot, tab swipe, and search selection.
   Resets the scroll window around the requested chapter, then lets
   the sentinels take over for continuous scrolling from there. */
async function loadActiveTab(){
  isBusy = true;
  const tab = state.tabs[state.activeTab];
  const [bookId, chapterStr] = tab.ref.split(".");
  const chapter = +chapterStr;

  loadedChapters = [];
  currentDisplayRef = {bookId, chapter};
  document.getElementById("verseContent").innerHTML = "";
  updateTabLabel(bookId, chapter);
  renderTabDots();

  await appendChapterBlock(bookId, chapter);
  const next = nextChapterRef(bookId, chapter);
  if(next) await appendChapterBlock(next.bookId, next.chapter);
  const prev = prevChapterRef(bookId, chapter);
  if(prev) await prependChapterBlock(prev.bookId, prev.chapter);

  const anchor = document.querySelector(`.chapter-block[data-book="${bookId}"][data-chapter="${chapter}"]`);
  if(anchor) anchor.scrollIntoView({block:"start"});
  isBusy = false;
}
function applyVerseClasses(el, key){
  el.classList.remove("hl-red","hl-yellow","hl-green","hl-blue","has-note");
  const hl = state.highlights[key];
  if(hl) el.classList.add("hl-"+hl);
  if(noteForVerse(key).length) el.classList.add("has-note");
}
function refreshVisibleVerseClasses(){
  document.querySelectorAll(".verse[data-ref]").forEach(el=> applyVerseClasses(el, el.dataset.ref));
}

let touchStartX=0;
document.addEventListener("DOMContentLoaded", ()=>{
  const pill = document.getElementById("tabPill");
  pill.addEventListener("touchstart", e=> touchStartX = e.touches[0].clientX);
  pill.addEventListener("touchend", e=>{
    const dx = e.changedTouches[0].clientX - touchStartX;
    if(Math.abs(dx) > 40){
      state.activeTab = dx<0 ? (state.activeTab+1)%3 : (state.activeTab+2)%3;
      saveState(); loadActiveTab();
    }
  });
});
function renderQuickTabs(){
  const wrap = document.getElementById("quickTabs");
  wrap.innerHTML = "";
  state.tabs.forEach((t,i)=>{
    const chip = document.createElement("div");
    chip.className = "quick-chip" + (i===state.activeTab?" active":"");
    chip.textContent = t.label;
    chip.onclick = ()=>{
      if(searchPickTarget){ return; } // in picker mode, quick tabs are disabled — user must search a specific verse
      state.activeTab=i; saveState(); loadActiveTab(); closeSheet("searchSheet");
    };
    wrap.appendChild(chip);
  });
}

/* =========================================================
   PREDICTIVE SEARCH  (dual-purpose: normal navigation + note verse-picker)
========================================================= */
let searchPickTarget = null; // null | "note"  — when set, selecting a result assigns a verse ref to currentNote instead of navigating

function onSearchInput(){
  const q = document.getElementById("searchInput").value.trim().toLowerCase();
  const list = document.getElementById("suggestions");
  list.innerHTML = "";
  if(!q) return;
  const m = q.match(/^([1-3]?\s?[a-z]+)\.?\s*(\d+)?:?(\d+)?/i);
  const bq = (m?m[1]:q).replace(/\s+/g,"");
  const matches = BOOKS.filter(b =>
    b.id.toLowerCase().startsWith(bq) ||
    b.name.toLowerCase().replace(/\s+/g,"").startsWith(bq)
  ).slice(0,5);
  matches.forEach(b=>{
    const chapter = (m && m[2]) ? Math.min(+m[2], b.chapters) : 1;
    const verse = (m && m[3]) ? +m[3] : null;
    const label = b.name + " " + chapter + (verse? ":"+verse:"");
    const item = document.createElement("div");
    item.className = "sugg-item";
    item.textContent = label;
    item.onclick = ()=>{
      if(searchPickTarget === "note" && currentNote){
        const v = verse || 1;
        currentNote.verseRefs = [`${b.id}.${chapter}.${v}`];
        currentNote.updatedAt = Date.now();
        saveState();
        updateRefChip();
        closeSheet("searchSheet");
        document.getElementById("searchInput").value=""; list.innerHTML="";
        return;
      }
      state.tabs[state.activeTab] = {ref:`${b.id}.${chapter}`, label: b.name+" "+chapter, verseFocus:verse||1};
      saveState(); loadActiveTab(); closeSheet("searchSheet");
      document.getElementById("searchInput").value=""; list.innerHTML="";
    };
    list.appendChild(item);
  });
}

/* =========================================================
   VERSE REFERENCE LABEL FORMATTING  (e.g. "Exodus 3:21" or "Exodus 3:21-23")
========================================================= */
function formatVerseRefLabel(keys){
  if(!keys || !keys.length) return "";
  const parsed = keys.map(k=>{ const [bookId,chapter,verse]=k.split("."); return {bookId, chapter:+chapter, verse:+verse}; });
  parsed.sort((a,b)=> (globalChapterIndex(a.bookId,a.chapter)*1000+a.verse) - (globalChapterIndex(b.bookId,b.chapter)*1000+b.verse));
  const groups = [];
  parsed.forEach(p=>{
    const last = groups[groups.length-1];
    if(last && last.bookId===p.bookId && last.chapter===p.chapter && p.verse === last.end+1){
      last.end = p.verse;
    } else {
      groups.push({bookId:p.bookId, chapter:p.chapter, start:p.verse, end:p.verse});
    }
  });
  return groups.map(g=>{
    const book = BOOKS.find(b=>b.id===g.bookId);
    const name = book ? book.name : g.bookId;
    return g.start===g.end ? `${name} ${g.chapter}:${g.start}` : `${name} ${g.chapter}:${g.start}-${g.end}`;
  }).join(", ");
}

/* =========================================================
   VERSE SELECTION + POPUP
========================================================= */
let selectedVerses = [];
function toggleVerseSelect(span, key){
  const idx = selectedVerses.indexOf(key);
  if(idx>-1){ selectedVerses.splice(idx,1); span.classList.remove("selected"); }
  else{ selectedVerses.push(key); span.classList.add("selected"); }
  renderVersePopup();
}
function renderVersePopup(){
  const popup = document.getElementById("versePopup");
  const preview = document.getElementById("popupNotes");
  preview.innerHTML = "";
  if(selectedVerses.length===0){
    popup.classList.remove("open");
    hideBackdrop();
    return;
  }
  document.getElementById("popupRef").textContent = formatVerseRefLabel(selectedVerses);
  selectedVerses.forEach(key=>{
    noteForVerse(key).forEach(n=>{
      const d = document.createElement("div");
      d.className = "popup-note-preview";
      d.textContent = `${n.title||"Untitled"} — ${(n.content||"").slice(0,40)}`;
      d.onclick = ()=> openNoteEditor(n.id);
      preview.appendChild(d);
    });
  });
  popup.classList.add("open");
  showBackdrop(()=>clearVerseSelection());
}
function noteForVerse(key){ return state.notes.filter(n=> n.verseRefs.includes(key)); }

function popupAction(action){
  if(action==="note"){ createNote(selectedVerses.slice()); clearVerseSelection(); return; }
  if(action==="copy"){ copySelectedVerses(); return; } // keep selection open after copy
  if(action==="blb"){ openBLB(selectedVerses[0]); return; }
}
function applyHighlight(color){
  selectedVerses.forEach(key=>{
    state.highlights[key] = (state.highlights[key]===color) ? undefined : color;
    if(state.highlights[key]===undefined) delete state.highlights[key];
    const el = document.querySelector(`.verse[data-ref="${key}"]`);
    if(el) applyVerseClasses(el, key);
  });
  saveState();
  clearVerseSelection();
}
function clearVerseSelection(){
  selectedVerses.forEach(key=>{
    const el = document.querySelector(`.verse[data-ref="${key}"]`);
    if(el) el.classList.remove("selected");
  });
  selectedVerses = [];
  document.getElementById("versePopup").classList.remove("open");
  hideBackdrop();
}
function copySelectedVerses(){
  const text = selectedVerses.map(k=>{
    const el = document.querySelector(`.verse[data-ref="${k}"]`);
    if(!el) return "";
    return Array.from(el.childNodes).filter(n=>n.nodeName!=="SUP").map(n=>n.textContent).join("").trim();
  }).join(" ");
  navigator.clipboard?.writeText(text);
}
function openBLB(key){
  if(!key) return;
  const [bookId, chapter, verse] = key.split(".");
  const slug = (BLB_SLUG_OVERRIDES[bookId] || bookId.toLowerCase());
  window.open(`https://www.blueletterbible.org/kjv/${slug}/${chapter}/${verse}/`, "_blank");
}

/* =========================================================
   NOTES LIST  (with delete)
========================================================= */
function openNotesList(){ openSheet("notesSheet"); renderNotesList(); }
function renderNotesList(){
  const q = (document.getElementById("notesSearch").value||"").toLowerCase();
  const wrap = document.getElementById("notesListWrap");
  wrap.innerHTML = "";
  state.notes
    .filter(n => !q || (n.title||"").toLowerCase().includes(q) || (n.content||"").toLowerCase().includes(q))
    .sort((a,b)=> b.updatedAt - a.updatedAt)
    .forEach(n=>{
      const row = document.createElement("div");
      row.className = "note-row";

      const main = document.createElement("div");
      main.className = "note-row-main";
      main.onclick = ()=> openNoteEditor(n.id);
      const dot = document.createElement("span");
      dot.className = "dot";
      dot.style.background = colorHex(n.color);
      const title = document.createElement("span");
      title.className = "note-row-title";
      title.textContent = n.title || "Untitled";
      main.appendChild(dot); main.appendChild(title);

      const date = document.createElement("span");
      date.className = "note-date";
      date.textContent = new Date(n.updatedAt).toLocaleDateString();

      const delBtn = document.createElement("button");
      delBtn.className = "note-delete-btn";
      delBtn.textContent = "🗑️";
      delBtn.onclick = (e)=> deleteNote(n.id, e);

      row.appendChild(main); row.appendChild(date); row.appendChild(delBtn);
      wrap.appendChild(row);
    });
}
function colorHex(c){ return {red:"#FF383C",yellow:"#FFCC00",green:"#34C759",blue:"#0088FF"}[c] || "#888"; }
function deleteNote(id, evt){
  if(evt) evt.stopPropagation();
  if(!confirm("Delete this note? This can't be undone.")) return;
  state.notes = state.notes.filter(n=>n.id!==id);
  saveState();
  renderNotesList();
  refreshVisibleVerseClasses();
}

/* =========================================================
   NOTE EDITOR + DRAWING
========================================================= */
let currentNote = null;
let drawMode=false, drawTool="pen", drawColor="#ffffff", strokes=[], undoStack=[], redoStack=[], currentStroke=null;
let ctx, canvasEl;

function createNote(verseRefs=[]){
  closeAllSheets(); // fixes: prevents an invisible sheet from stealing focus/input from the editor
  const n = {id:crypto.randomUUID(), title:"", verseRefs, content:"", color:"blue", strokes:[], createdAt:Date.now(), updatedAt:Date.now()};
  state.notes.push(n); saveState();
  openNoteEditor(n.id);
}
function openNoteEditor(id){
  closeAllSheets();
  currentNote = state.notes.find(n=>n.id===id);
  if(!currentNote) return;
  document.getElementById("noteTitle").value = currentNote.title;
  document.getElementById("noteContent").value = currentNote.content;
  updateRefChip();
  strokes = currentNote.strokes || [];
  undoStack=[]; redoStack=[];

  // reset drawing state defensively so a prior session can't block typing
  drawMode = false;
  drawTool = "pen";
  document.getElementById("modeBadge").textContent = "Typing";
  document.getElementById("modeBadge").classList.remove("active");
  document.getElementById("drawToggleBtn").classList.remove("draw-active");
  document.getElementById("noteContentWrap").classList.remove("drawing");

  showScreen("noteEditor");
  requestAnimationFrame(()=>{
    setupCanvas();
    selectTool("pen");
    const titleEl = document.getElementById("noteTitle");
    titleEl.focus();
    titleEl.selectionStart = titleEl.selectionEnd = titleEl.value.length;
  });
}
function closeNoteEditor(){ showScreen("main"); drawMode=false; }
function saveCurrentNote(){
  if(!currentNote) return;
  currentNote.title = document.getElementById("noteTitle").value;
  currentNote.content = document.getElementById("noteContent").value;
  currentNote.updatedAt = Date.now();
  saveState();
}

function updateRefChip(){
  const chip = document.getElementById("refChip");
  chip.textContent = currentNote.verseRefs.length ? formatVerseRefLabel(currentNote.verseRefs) : "Choose a verse";
}
function openVersePicker(){
  if(!currentNote) return;
  searchPickTarget = "note";
  document.getElementById("searchInput").placeholder = "Choose a verse for this note…";
  openSheet("searchSheet");
}

function setupCanvas(){
  canvasEl = document.getElementById("drawCanvas");
  const wrap = document.getElementById("noteContentWrap");
  canvasEl.width = wrap.clientWidth; canvasEl.height = wrap.clientHeight;
  ctx = canvasEl.getContext("2d");
  redrawCanvas();
  canvasEl.onpointerdown = onPointerDown;
  canvasEl.onpointermove = onPointerMove;
  canvasEl.onpointerup = onPointerUp;
}
function toggleDrawMode(){
  drawMode = !drawMode;
  canvasEl.classList.toggle("active", drawMode);
  document.getElementById("noteContent").style.pointerEvents = drawMode? "none":"auto";
  // clear, unmistakable mode indication
  document.getElementById("drawToggleBtn").classList.toggle("draw-active", drawMode);
  document.getElementById("noteContentWrap").classList.toggle("drawing", drawMode);
  const badge = document.getElementById("modeBadge");
  badge.textContent = drawMode ? "✏️ Drawing" : "Typing";
  badge.classList.toggle("active", drawMode);
  if(drawMode) document.getElementById("noteContent").blur();
  else document.getElementById("noteContent").focus();
}
function selectTool(t){
  drawTool = t;
  const pen = document.getElementById("penTool"), eraser = document.getElementById("eraserTool");
  pen.classList.toggle("sel", t==="pen");
  pen.classList.toggle("inactive", t!=="pen");
  eraser.classList.toggle("sel", t==="eraser");
  eraser.classList.toggle("inactive", t!=="eraser");
}
function pickColor(){ document.getElementById("colorPicker").click(); }
function setDrawColor(v){ drawColor=v; document.getElementById("colorSwatch").style.background=v; }

function onPointerDown(e){
  if(!drawMode) return;
  const pos = getPos(e);
  if(drawTool==="pen"){
    currentStroke = {tool:"pen", color:drawColor, width:3, points:[pos]};
  } else {
    eraseAt(pos);
  }
}
function onPointerMove(e){
  if(!drawMode) return;
  if(drawTool==="pen" && currentStroke){
    currentStroke.points.push(getPos(e));
    redrawCanvas(currentStroke);
  } else if(drawTool==="eraser" && e.buttons===1){
    eraseAt(getPos(e));
  }
}
function onPointerUp(){
  if(drawTool==="pen" && currentStroke){
    strokes.push(currentStroke);
    undoStack.push({type:"add", stroke:currentStroke});
    redoStack=[];
    currentStroke=null;
    persistStrokes(); updateUndoRedoUI(); redrawCanvas();
  }
}
function getPos(e){
  const r = canvasEl.getBoundingClientRect();
  return {x:e.clientX-r.left, y:e.clientY-r.top};
}
function eraseAt(pos){
  const idx = strokes.findIndex(s => s.points.some(p => Math.hypot(p.x-pos.x,p.y-pos.y) < 12));
  if(idx>-1){
    const [removed] = strokes.splice(idx,1);
    undoStack.push({type:"remove", stroke:removed, index:idx});
    redoStack=[];
    persistStrokes(); updateUndoRedoUI(); redrawCanvas();
  }
}
function redrawCanvas(previewStroke){
  if(!ctx) return;
  ctx.clearRect(0,0,canvasEl.width,canvasEl.height);
  [...strokes, previewStroke].filter(Boolean).forEach(s=>{
    ctx.strokeStyle = s.color; ctx.lineWidth = s.width; ctx.lineJoin="round"; ctx.lineCap="round";
    ctx.beginPath();
    s.points.forEach((p,i)=> i===0 ? ctx.moveTo(p.x,p.y) : ctx.lineTo(p.x,p.y));
    ctx.stroke();
  });
}
function undoStroke(){
  const action = undoStack.pop();
  if(!action) return;
  if(action.type==="add") strokes.splice(strokes.indexOf(action.stroke),1);
  if(action.type==="remove") strokes.splice(action.index,0,action.stroke);
  redoStack.push(action);
  persistStrokes(); updateUndoRedoUI(); redrawCanvas();
}
function redoStroke(){
  const action = redoStack.pop();
  if(!action) return;
  if(action.type==="add") strokes.push(action.stroke);
  if(action.type==="remove") strokes.splice(strokes.indexOf(action.stroke),1);
  undoStack.push(action);
  persistStrokes(); updateUndoRedoUI(); redrawCanvas();
}
function updateUndoRedoUI(){
  document.getElementById("undoBtn").classList.toggle("dim", undoStack.length===0);
  document.getElementById("redoBtn").classList.toggle("dim", redoStack.length===0);
}
function persistStrokes(){ if(currentNote){ currentNote.strokes = strokes; currentNote.updatedAt = Date.now(); saveState(); } }

/* =========================================================
   KNOWLEDGE GRAPH (simple force layout, no external libs)
========================================================= */
let gnodes=[], gedges=[], gctx, gcanvas, dragNode=null;
function openGraph(){
  showScreen("graphScreen");
  buildGraph();
  requestAnimationFrame(()=>{
    gcanvas = document.getElementById("graphCanvas");
    gcanvas.width = gcanvas.clientWidth; gcanvas.height = gcanvas.clientHeight;
    gctx = gcanvas.getContext("2d");
    gcanvas.onpointerdown = gPointerDown;
    gcanvas.onpointermove = gPointerMove;
    gcanvas.onpointerup = ()=> dragNode=null;
    simTick();
  });
}
function closeGraph(){ showScreen("main"); }
function buildGraph(){
  gnodes = state.notes.map((n,i)=>({id:n.id, label:n.title||"Untitled", x:100+Math.random()*200, y:100+Math.random()*300, vx:0, vy:0, note:n}));
  gedges = [];
  for(let i=0;i<gnodes.length;i++){
    for(let j=i+1;j<gnodes.length;j++){
      if(shouldLink(gnodes[i].note, gnodes[j].note)) gedges.push({a:i,b:j});
    }
  }
}
function keywordsOf(n){
  const stop = new Set(["the","and","for","that","with","this","from","have","was","are"]);
  return ((n.title||"")+" "+(n.content||"")).toLowerCase().split(/\W+/).filter(w=>w.length>3 && !stop.has(w));
}
function shouldLink(a,b){
  const sharedVerse = a.verseRefs.some(v=>b.verseRefs.includes(v));
  if(sharedVerse) return true;
  const wa = keywordsOf(a), wb = new Set(keywordsOf(b));
  return wa.some(w=>wb.has(w));
}
function simTick(){
  if(!gctx) return;
  for(let i=0;i<gnodes.length;i++){
    for(let j=i+1;j<gnodes.length;j++){
      const a=gnodes[i], b=gnodes[j];
      let dx=a.x-b.x, dy=a.y-b.y, dist=Math.hypot(dx,dy)||1;
      const force = 800/(dist*dist);
      dx/=dist; dy/=dist;
      a.vx+=dx*force; a.vy+=dy*force; b.vx-=dx*force; b.vy-=dy*force;
    }
  }
  gedges.forEach(e=>{
    const a=gnodes[e.a], b=gnodes[e.b];
    let dx=b.x-a.x, dy=b.y-a.y, dist=Math.hypot(dx,dy)||1;
    const force=(dist-120)*0.01;
    dx/=dist; dy/=dist;
    a.vx+=dx*force; a.vy+=dy*force; b.vx-=dx*force; b.vy-=dy*force;
  });
  gnodes.forEach(n=>{
    if(n===dragNode) return;
    n.vx*=0.85; n.vy*=0.85;
    n.x+=n.vx; n.y+=n.vy;
    n.x=Math.max(30,Math.min(gcanvas.width-30,n.x));
    n.y=Math.max(30,Math.min(gcanvas.height-30,n.y));
  });
  gctx.clearRect(0,0,gcanvas.width,gcanvas.height);
  gctx.strokeStyle="rgba(255,255,255,.3)";
  gedges.forEach(e=>{
    gctx.beginPath(); gctx.moveTo(gnodes[e.a].x,gnodes[e.a].y); gctx.lineTo(gnodes[e.b].x,gnodes[e.b].y); gctx.stroke();
  });
  gnodes.forEach(n=>{
    gctx.fillStyle="#262626";
    roundRect(gctx, n.x-40, n.y-14, 80, 28, 14);
    gctx.fill();
    gctx.fillStyle="#fff"; gctx.font="12px sans-serif"; gctx.textAlign="center"; gctx.textBaseline="middle";
    gctx.fillText(n.label.slice(0,12), n.x, n.y);
  });
  requestAnimationFrame(simTick);
}
function roundRect(c,x,y,w,h,r){ c.beginPath(); c.moveTo(x+r,y); c.arcTo(x+w,y,x+w,y+h,r); c.arcTo(x+w,y+h,x,y+h,r); c.arcTo(x,y+h,x,y,r); c.arcTo(x,y,x+w,y,r); c.closePath(); }
function gPointerDown(e){
  const r=gcanvas.getBoundingClientRect(); const x=e.clientX-r.left, y=e.clientY-r.top;
  dragNode = gnodes.find(n=>Math.hypot(n.x-x,n.y-y)<40);
}
function gPointerMove(e){
  if(!dragNode) return;
  const r=gcanvas.getBoundingClientRect();
  dragNode.x=e.clientX-r.left; dragNode.y=e.clientY-r.top;
}

/* =========================================================
   SETTINGS: FONT SIZE
========================================================= */
function changeFontSize(delta){
  state.settings.fontSize = Math.max(12, Math.min(30, state.settings.fontSize+delta));
  applyFontSize(); saveState();
}
function applyFontSize(){ document.getElementById("verseContent").style.fontSize = state.settings.fontSize+"px"; }

function exportBackup(){
  const blob = new Blob([JSON.stringify(state,null,2)], {type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = "whoishe-backup.json"; a.click();
}
function resetAll(){
  if(confirm("This clears all local notes/settings. Continue?")){
    localStorage.removeItem("whoishe_state"); location.reload();
  }
}

/* =========================================================
   GOOGLE SIGN-IN + DRIVE (appDataFolder) SYNC
========================================================= */
let tokenClient, accessToken=null;
function initGoogleAuth(){
  if(!window.google || GOOGLE_CLIENT_ID.startsWith("YOUR_")) return;
  tokenClient = google.accounts.oauth2.initTokenClient({
    client_id: GOOGLE_CLIENT_ID,
    scope: DRIVE_SCOPE,
    callback: async (resp)=>{
      accessToken = resp.access_token;
      state.settings.signedIn = true; saveState();
      document.getElementById("signInBtn").textContent = "Signed in";
      document.getElementById("syncStatus").textContent = "Synced just now";
      await driveLoad();
    }
  });
}
function handleGoogleAuthClick(){
  if(!tokenClient){ alert("Set GOOGLE_CLIENT_ID in the code first."); return; }
  tokenClient.requestAccessToken();
}
async function driveFindFileId(){
  const res = await fetch(`https://www.googleapis.com/drive/v3/files?spaces=appDataFolder&q=name='${DRIVE_FILE_NAME}'&fields=files(id,name)`,
    {headers:{Authorization:`Bearer ${accessToken}`}});
  const json = await res.json();
  return json.files && json.files[0] ? json.files[0].id : null;
}
async function driveLoad(){
  if(!accessToken) return;
  const id = await driveFindFileId();
  if(!id) return; // nothing saved yet for this account
  const res = await fetch(`https://www.googleapis.com/drive/v3/files/${id}?alt=media`, {headers:{Authorization:`Bearer ${accessToken}`}});
  const remote = await res.json();

  const localNotes = new Map(state.notes.map(n=>[n.id,n]));
  (remote.notes||[]).forEach(rn=>{
    const ln = localNotes.get(rn.id);
    if(!ln || rn.updatedAt > ln.updatedAt) localNotes.set(rn.id, rn);
  });
  state.notes = Array.from(localNotes.values());

  // Restore apiKey/bibleId from Drive whenever this device doesn't already have one set —
  // this is what makes the key "fetch automatically" after signing in on a new device/browser.
  const remoteSettings = remote.settings || {};
  state.settings = {
    ...state.settings,
    ...remoteSettings,
    apiKey: state.settings.apiKey || remoteSettings.apiKey || "",
    bibleId: state.settings.bibleId || remoteSettings.bibleId || ""
  };

  saveState();
  document.getElementById("apiKeyInput").value = state.settings.apiKey || "";
  if(state.settings.apiKey) await loadBibleList(true); // silently repopulate translations using the restored key
  else loadActiveTab();
}

async function driveSave(){
  if(!accessToken) return;
  const id = await driveFindFileId();
  const body = JSON.stringify(state);
  if(id){
    await fetch(`https://www.googleapis.com/upload/drive/v3/files/${id}?uploadType=media`, {
      method:"PATCH", headers:{Authorization:`Bearer ${accessToken}`, "Content-Type":"application/json"}, body
    });
  } else {
    const metadata = {name:DRIVE_FILE_NAME, parents:["appDataFolder"]};
    const form = new FormData();
    form.append("metadata", new Blob([JSON.stringify(metadata)], {type:"application/json"}));
    form.append("file", new Blob([body], {type:"application/json"}));
    await fetch("https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart", {
      method:"POST", headers:{Authorization:`Bearer ${accessToken}`}, body: form
    });
  }
  document.getElementById("syncStatus").textContent = "Synced " + new Date().toLocaleTimeString();
}
